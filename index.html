<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b6b4f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="محطة الكرمل">
<title>محطة الكرمل بيت عمرة</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{--th:#1f3a5f;--bgt:#eef1f4;margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bgt);color:#1d2733;font-size:16px}
body.tk{--th:#0b6b4f;--bgt:#e6f4ec}body.tb{--th:#9b2c5a;--bgt:#f9e9f0}
header{background:var(--th);color:#fff;padding:12px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;position:sticky;top:0;z-index:9}
header h1{font-size:18px;margin:0}
header button{background:#ffffff33;color:#fff;border:0;padding:8px 10px;border-radius:8px;font-family:inherit;font-size:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #d5dbe1;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:6px 1px;border:0;border-top:3px solid transparent;background:none;color:#64748b;font-family:inherit;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:66px}
nav button .ic{font-size:27px;line-height:1.1}
nav button.ck{border-top-color:#0b6b4f}nav button.cb{border-top-color:#9b2c5a}
nav button.on{color:var(--th);font-weight:bold;background:#0000000d}
main{max-width:560px;margin:auto;padding:10px 10px 104px}
.card{background:#fff;border:1px solid #d5dbe1;border-radius:14px;padding:12px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px;color:var(--th)}
.card.g{background:#fff4e5;border-color:#f0b35c}.card.g h2{color:#b45f06}
.card.d{background:#e8f1fb;border-color:#7fb0e6}.card.d h2{color:#1c5fa8}
.card.y{background:#fff9c4;border-color:#e6d84f}.card.y h2{color:#8a7a00}
.card.s{background:#e9f7ef;border-color:#8fd0aa}
.card.p{background:#f1ecfa;border-color:#b9a5e0}.card.p h2{color:#5b3fa0}
.fl{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:13px;color:#5b6b7b;gap:4px;flex:1 1 140px}
input,select{padding:10px;min-height:46px;border:1px solid #c5ced6;border-radius:10px;background:#fff;color:#1d2733;font-family:inherit;font-size:16px;width:100%}
.btn{background:var(--th);color:#fff;border:0;padding:10px 16px;min-height:46px;border-radius:10px;font-family:inherit;font-size:16px;flex:1 1 auto}
.wa{background:#25a244}
.w{overflow-x:auto;margin-bottom:6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid #d5dbe1;padding:8px 6px;text-align:center;white-space:nowrap;background:#ffffffaa}
th{background:#0000000d;font-size:12px}
tfoot td,.tot td{font-weight:bold;background:#0000000d}
.x{background:none;border:0;color:#c0392b;font-size:20px;padding:4px 8px}.x.e{color:#1c5fa8}
.neg{color:#c0392b}.empty{color:#64748b;padding:6px;font-size:13px}
.ro{padding:10px;background:#0000000d;border-radius:10px;text-align:center;min-height:46px}
h3{font-size:14px;margin:8px 0 4px}
#toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:30}
#toast.on{opacity:.9}
.mb{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:40}
.mb form{background:#fff;width:100%;max-width:560px;margin:auto;padding:16px;border-radius:16px 16px 0 0;display:flex;flex-direction:column;gap:10px;max-height:88vh;overflow:auto}
.mb h2{margin:0;color:var(--th)}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<header><h1>⛽ محطة الكرمل بيت عمرة<small id="ttl" style="display:block;font-size:13px;font-weight:normal;opacity:.9"></small></h1><small id="st" style="font-size:12px"></small><span><button onclick="exp()">نسخة احتياطية</button> <button onclick="bakList()">استرجاع</button><input type="file" id="imp" accept=".json" hidden onchange="rest(this)"></span></header>
<nav id="nav"></nav><main id="main"></main><div id="md"></div><div id="toast">✔ تم الحفظ تلقائياً</div>
<script>
const PG=[['sup','المورد','🏭'],['k','الكرمل','⛽'],['dk','ديون الكرمل','💳'],['b','بيت عمرة','⛽'],['db','ديون بيت عمرة','💳'],['ds','ملخص الديون','📋'],['sum','الملخص','📊']];
const TT={sup:'🏭 المورد',k:'⛽ نقطة الكرمل',dk:'💳 ديون الكرمل',b:'⛽ نقطة بيت عمرة',db:'💳 ديون بيت عمرة',ds:'📋 ملخص الديون',sum:'📊 الملخص العام'};
const CL={k:'ck',dk:'ck',b:'cb',db:'cb'},TH={k:'tk',dk:'tk',b:'tb',db:'tb'};
const NM={k:'نقطة الكرمل',b:'نقطة بيت عمرة'};
function norm(o){const d=Object.assign({sup:[],sph:{},pur:[],pay:[]},o||{});d.pts=Object.assign({k:{},b:{}},d.pts);d.dw=Object.assign({k:[],b:[]},d.dw);d.dp=Object.assign({k:[],b:[]},d.dp);d.cu=Object.assign({k:[],b:[]},d.cu);['k','b'].forEach(k=>{if(Array.isArray(d.pts[k])){const o={};d.pts[k].forEach(r=>o[r.date]=r);d.pts[k]=o}});delete d.cur;delete d.cc;delete d.flt;return d}
let D,U,pt;try{D=JSON.parse(localStorage.getItem('fuelDB'))}catch(e){}
const _old=D||{};D=norm(D);
try{U=JSON.parse(localStorage.getItem('fuelUI'))}catch(e){}
U=Object.assign({cur:_old.cur||'',cc:_old.cc||{k:'',b:''},flt:_old.flt||{from:'',to:''}},U||{});
let cur=localStorage.getItem('fuelPg')||'sup',cd={k:today(),b:today()};
function today(){return new Date().toISOString().slice(0,10)}
const n=x=>+x||0,f=x=>n(x).toLocaleString('en',{maximumFractionDigits:2}),typ=t=>t=='b'?'بنزين':'سولار';
let tt;function save(){try{localStorage.setItem('fuelDB',JSON.stringify(D));localStorage.setItem('fuelUI',JSON.stringify(U))}catch(e){alert('تعذر الحفظ')}clearTimeout(pt);pt=setTimeout(push,300);const t=document.getElementById('toast');t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1200)}
const get=p=>p.split('.').reduce((o,k)=>o[k],D);
const sel=(nm,v)=>`<select name="${nm}"><option value="b">بنزين</option><option value="s">سولار</option></select>`;
const fld=(l,nm,ty,v='')=>`<label>${l}<input name="${nm}" type="${ty}" value="${v}" ${ty=='number'?'step="any" min="0" inputmode="decimal"':''} required></label>`;
function add(path,fm,k){const o={};new FormData(fm).forEach((v,key)=>o[key]=fm[key].type=='number'?n(v):v);if(k)o.name=U.cc[k];get(path).push(o);save();R();return false}
function pin(){const v=prompt('أدخل الرقم السري للحذف');if(v===null)return false;if(v.trim()==='123')return true;alert('الرقم السري غير صحيح');return false}
function del(p,i){if(!pin())return;const a=get(p);Array.isArray(a)?a.splice(i,1):delete a[i];save();R()}
const srt=a=>a.map((r,i)=>({r,i})).sort((x,y)=>x.r.date<y.r.date?1:-1);
function tbl(path,head,rows,foot){rows=rows.map(r=>Array.isArray(r[0])?r:[r]);if(!rows.length)return'<div class="empty">لا توجد سجلات بعد</div>';
return`<div class="w"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}${path?'<th></th>':''}</tr></thead><tbody>${rows.map(([c,i])=>`<tr>${c.map(x=>`<td>${x}</td>`).join('')}${path?`<td><button class="x e" onclick="ed('${path}','${i}')">✎</button><button class="x" onclick="del('${path}','${i}')">✕</button></td>`:''}</tr>`).join('')}</tbody>${foot?`<tfoot><tr>${foot.map(x=>`<td>${x}</td>`).join('')}${path?'<td></td>':''}</tr></tfoot>`:''}</table></div>`}
const card=(t,b,c='')=>`<div class="card ${c}"><h2>${t}</h2>${b}</div>`;
const kv=a=>tbl('',['البند','القيمة'],a.map(x=>[x]));

/* المورد */
function pSup(){const s=U.cur;
D.sph=D.sph||{};
let h=card('① مورد جديد',`<form class="fl" onsubmit="return addSup(this)"><label>اسم المورد<input name="nm" required></label><label>رقم الواتس اب<input name="ph" type="tel" inputmode="tel" placeholder="0599123456"></label><button class="btn">إضافة</button></form>`)+card('② اختيار المورد',`<label>اسم المورد<select onchange="U.cur=this.value;save();R()">${D.sup.length?'':'<option>— أضف مورداً —</option>'}${D.sup.map(x=>`<option${x==s?' selected':''}>${x}</option>`).join('')}</select></label>${s?`<div class="fl" style="margin-top:8px"><input type="tel" inputmode="tel" placeholder="رقم الواتس اب" value="${D.sph[s]||''}" onchange="D.sph[U.cur]=this.value;save()"><button class="btn wa" onclick="waSup()">📲 واتس اب</button><button class="btn" style="background:#64748b" onclick="renSup()">✎ الاسم</button></div>`:''}`);
if(!s)return h;
const P=srt(D.pur).filter(o=>o.r.sup==s),Y=srt(D.pay).filter(o=>o.r.sup==s);
const tl=P.reduce((a,o)=>a+n(o.r.liters),0),tp=P.reduce((a,o)=>a+o.r.liters*o.r.price,0),ty=Y.reduce((a,o)=>a+n(o.r.amount),0);
h+=card('③ المشتريات من '+s,`<form class="fl" onsubmit="D.pur.push({sup:U.cur,date:this.date.value,type:this.type.value,liters:n(this.liters.value),price:n(this.price.value)});save();R();return false">${fld('التاريخ','date','date',today())}<label>النوع${sel('type')}</label>${fld('الكمية (لتر)','liters','number')}${fld('السعر/لتر','price','number')}<button class="btn">إضافة</button></form>`+
tbl('pur',['التاريخ','الصنف','الكمية (لتر)','السعر/لتر','المجموع ₪'],P.map(o=>[[o.r.date,typ(o.r.type),f(o.r.liters),f(o.r.price),f(o.r.liters*o.r.price)],o.i]),['المجموع','',f(tl),'',f(tp)]));
h+=card('④ الدفعات الواصلة للمورد',`<form class="fl" onsubmit="D.pay.push({sup:U.cur,date:this.date.value,amount:n(this.amount.value)});save();R();return false">${fld('التاريخ','date','date',today())}${fld('الدفعة ₪','amount','number')}<button class="btn">إضافة</button></form>`+
tbl('pay',['التاريخ','الدفعة ₪'],Y.map(o=>[[o.r.date,f(o.r.amount)],o.i]),['المجموع',f(ty)]),'y');
return h+card('⑤ ملخص '+s,tbl('',['البند','القيمة'],[['مجموع المشتريات ₪',f(tp)],['مجموع الدفعات ₪',f(ty)],['المتبقي للمورد ₪',`<b class="${tp-ty>0?'neg':''}">${f(tp-ty)}</b>`]].map(x=>[x])),'s')}
function waSup(){let p=(D.sph[U.cur]||'').replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);else if(p.startsWith('0'))p='972'+p.slice(1);window.open('https://wa.me/'+p,'_blank')}
function addSup(fm){const v=fm.nm.value.trim();if(v&&!D.sup.includes(v)){D.sup.push(v);D.sph=D.sph||{};D.sph[v]=fm.ph.value;U.cur=v;save();R()}return false}

/* النقاط */
function dflt(k){const ds=Object.keys(D.pts[k]).filter(d=>d<cd[k]).sort(),L=D.pts[k][ds[ds.length-1]]||{};return{gm:L.ge2||'',dm:L.de2||'',ge1:'',ge2:'',de1:'',de2:''}}
const rec=k=>D.pts[k][cd[k]]||dflt(k);
function sf(k,fl,v){const r=D.pts[k][cd[k]]=rec(k);r[fl]=v===''?'':n(v);save();calc(k)}
function sh(m,e1,e2){const ok=x=>x!==''&&x!=null;return[ok(e1)?n(e1)-n(m):0,ok(e1)&&ok(e2)?n(e2)-n(e1):0]}
function cv(r){return{g:sh(r.gm,r.ge1,r.ge2),d:sh(r.dm,r.de1,r.de2)}}
function ptTot(k,ok){const t={g:0,d:0,s:0};Object.entries(D.pts[k]).forEach(([dy,r])=>{if(ok&&!ok(dy))return;const x=cv(r),g=x.g[0]+x.g[1],d=x.d[0]+x.d[1];t.g+=g;t.d+=d;t.s+=g+d});return t}
function pPt(k){const r=rec(k),I=(fl,l)=>`<label>${l}<input type="number" inputmode="decimal" step="any" value="${r[fl]}" oninput="sf('${k}','${fl}',this.value)"></label>`;
const blk=(c,t,m,e1,e2,id)=>card(t,`<div class="fl">${I(m,'عداد الصباح ₪')}${I(e1,'نهاية الشفت 1 ₪')}<label>بداية الشفت 2 ₪ (نفسها)<div class="ro" id="${id}${k}"></div></label>${I(e2,'نهاية الشفت 2 ₪')}</div>`,c);
const days=Object.keys(D.pts[k]).sort().reverse(),T=ptTot(k);
return card('① التاريخ',`<label>التاريخ<input type="date" value="${cd[k]}" onchange="cd['${k}']=this.value||today();R()"></label><div class="empty">أرقام العدادات بالشيكل (الماكينة تعدّ النقود). يُحفظ كل ما تكتبه تلقائياً</div>`)
+blk('g','② عدادات البنزين (₪)','gm','ge1','ge2','sg')+blk('d','② عدادات السولار (₪)','dm','de1','de2','sd')
+`<div id="c${k}"></div>`
+card('سجل الأيام — '+NM[k],tbl('pts.'+k,['التاريخ','بنزين ₪','سولار ₪','المبيعات ₪'],days.map(d=>{const x=cv(D.pts[k][d]),g=x.g[0]+x.g[1],q=x.d[0]+x.d[1];return[[`<a href="#" onclick="cd['${k}']='${d}';R();scrollTo(0,0);return false">${d}</a>`,f(g),f(q),f(g+q)],d]}),['المجموع',f(T.g),f(T.d),f(T.s)]),'s')}
function calc(k){const r=rec(k),x=cv(r),el=document.getElementById('c'+k);if(!el)return;
const g=x.g[0]+x.g[1],d=x.d[0]+x.d[1];
document.getElementById('sg'+k).textContent=r.ge1===''?'—':f(r.ge1);document.getElementById('sd'+k).textContent=r.de1===''?'—':f(r.de1);
const sh2=i=>tbl('',['الصنف','المبيعات ₪'],[['بنزين',f(x.g[i])],['سولار',f(x.d[i])]],['المجموع',f(x.g[i]+x.d[i])]);
el.innerHTML=(x.g.concat(x.d).some(v=>v<0)?card('⚠️ تنبيه','<div class="neg">يوجد عداد نهاية أصغر من العداد السابق، راجع الأرقام</div>','g'):'')
+card('③ مبيعات اليوم بالشيكل لكل صنف',tbl('',['الصنف','المبيعات ₪'],[['بنزين',f(g)],['سولار',f(d)]],['إجمالي اليوم',f(g+d)]),'s')
+card('④ مبيعات الشفتات (₪)',`<h3>الشفت 1</h3>${sh2(0)}<h3>الشفت 2</h3>${sh2(1)}`,'p')}

/* الديون */
function bal(k,nm){let w=0,p=0,L={b:0,s:0},M={b:0,s:0};D.dw[k].forEach(r=>{if(r.name==nm){const v=r.liters*r.price;w+=v;L[r.type]+=r.liters;M[r.type]+=v}});D.dp[k].forEach(r=>{if(r.name==nm)p+=n(r.amount)});return{w,p,L,M,r:w-p}}
function pDebt(k){const C=D.cu[k],cc=U.cc[k],c=C.find(x=>x.name==cc);
let h=card('① الزبون',`<form class="fl" onsubmit="return addCu('${k}',this)"><label>اسم زبون جديد<input name="nm" required></label><label>رقم الواتس اب<input name="ph" type="tel" inputmode="tel" placeholder="0599123456" required></label><button class="btn">إضافة</button></form>
<label>اختر الزبون<select onchange="U.cc['${k}']=this.value;save();R()">${C.length?'':'<option>— أضف زبوناً —</option>'}${C.map(x=>`<option${x.name==cc?' selected':''}>${x.name}</option>`).join('')}</select></label>${c?`<div class="fl" style="margin-top:8px"><input type="tel" inputmode="tel" placeholder="رقم الواتس اب" value="${c.phone||''}" onchange="c_ph('${k}',this.value)"><button class="btn" style="background:#64748b" onclick="renCu('${k}')">✎ الاسم</button><button class="btn" style="background:#c0392b" onclick="delCu('${k}')">حذف الزبون</button></div>`:''}`);
if(c){const B=bal(k,cc);
h+=card('② مشتريات '+cc,`<form class="fl" onsubmit="return add('dw.${k}',this,'${k}')">${fld('التاريخ','date','date',today())}<label>الصنف${sel('type')}</label>${fld('الكمية (لتر)','liters','number')}${fld('السعر/لتر','price','number')}<button class="btn">إضافة</button></form>`+
tbl('dw.'+k,['التاريخ','الصنف','لتر','السعر','المجموع ₪'],srt(D.dw[k]).filter(o=>o.r.name==cc).map(o=>[[o.r.date,typ(o.r.type),f(o.r.liters),f(o.r.price),f(o.r.liters*o.r.price)],o.i])));
h+=card('③ الدفعات',`<form class="fl" onsubmit="return add('dp.${k}',this,'${k}')">${fld('التاريخ','date','date',today())}${fld('الدفعة ₪','amount','number')}<button class="btn">إضافة</button></form>`+
tbl('dp.'+k,['التاريخ','الدفعة ₪'],srt(D.dp[k]).filter(o=>o.r.name==cc).map(o=>[[o.r.date,f(o.r.amount)],o.i])),'y');
h+=card('④ ملخص '+cc,tbl('',['البند','لتر','₪'],[['سحوبات البنزين',f(B.L.b),f(B.M.b)],['سحوبات السولار',f(B.L.s),f(B.M.s)],['مجموع السحوبات',f(B.L.b+B.L.s),f(B.w)],['مجموع الدفعات','',f(B.p)],['المتبقي','',`<b class="${B.r>0?'neg':''}">${f(B.r)}</b>`]])+`<button class="btn wa" onclick="wa('${k}','${cc}')">📲 إرسال رسالة واتس اب</button>`,'s');
const LG=[...D.dw[k].filter(r=>r.name==cc).map(r=>({d:r.date,t:'سحب '+typ(r.type)+' '+f(r.liters)+' لتر',w:r.liters*r.price,p:0})),...D.dp[k].filter(r=>r.name==cc).map(r=>({d:r.date,t:'دفعة',w:0,p:n(r.amount)}))].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);let run=0;
h+=card('⑤ كشف حساب '+cc,tbl('',['التاريخ','البيان','عليه ₪','له ₪','الرصيد ₪'],LG.map(r=>{run+=r.w-r.p;return[r.d,r.t,r.w?f(r.w):'',r.p?f(r.p):'',f(run)]})))}
const rows=C.map(x=>[x.name,f(bal(k,x.name).r)+' ₪',bal(k,x.name).r>0?`<button class="btn wa" onclick="wa('${k}','${x.name}')">واتس اب</button>`:'—']);
return h+card('⑥ كل الزبائن — '+NM[k],tbl('',['الزبون','المتبقي','تذكير'],rows.map(x=>[x])),'p')}
function c_ph(k,v){D.cu[k].find(x=>x.name==U.cc[k]).phone=v;save()}
function delCu(k){const nm=U.cc[k];if(!pin())return;D.cu[k]=D.cu[k].filter(x=>x.name!=nm);D.dw[k]=D.dw[k].filter(r=>r.name!=nm);D.dp[k]=D.dp[k].filter(r=>r.name!=nm);U.cc[k]=D.cu[k][0]?D.cu[k][0].name:'';save();R()}
function addCu(k,fm){const nm=fm.nm.value.trim();if(nm&&!D.cu[k].some(x=>x.name==nm)){D.cu[k].push({name:nm,phone:fm.ph.value});U.cc[k]=nm;save();R()}return false}
function wa(k,nm){const c=D.cu[k].find(x=>x.name==nm),B=bal(k,nm);let p=(c.phone||'').replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);else if(p.startsWith('0'))p='972'+p.slice(1);
